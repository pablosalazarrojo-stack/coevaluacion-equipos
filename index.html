<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F1EEE8">
<title>Coevaluación de equipo · Team peer evaluation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Barlow+Condensed:wght@600;800&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Look H-FARM: crema, tinta y naranja; Newsreader para títulos, Archivo para texto, Barlow Condensed para la portada; esquinas rectas */
:root{
  --crema:#F1EEE8; --tinta:#101216; --gris:#5E6168; --gris-osc:#3A3D43;
  --naranja:#FF5B1A; --naranja-txt:#D9480F; --neutro:#CFC9BD; --papel:#FBFAF7; --verde:#2F7D4A;
  --serif:Newsreader,Georgia,serif; --sans:Archivo,Arial,sans-serif; --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--crema);overscroll-behavior-y:contain}
/* jalar para actualizar (solo la pantalla actual) */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-80px);z-index:45;background:var(--tinta);color:var(--crema);padding:9px 16px;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;transition:transform .12s ease-out;pointer-events:none}
.ptr.listo{background:var(--naranja);color:var(--tinta)}
.ptr.drag{transition:none}
body{color:var(--tinta);font-family:var(--sans);font-size:17px;line-height:1.45;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:24px;width:100%;min-width:0}
section{display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3,p{margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--naranja);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* encabezado */
.top{display:flex;align-items:center;gap:12px}
.sq{width:14px;height:14px;background:var(--naranja);flex:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;line-height:1.35}
.eyebrow .en{color:var(--gris)}
.top.mat{align-items:flex-start}
.top.mat .sq{margin-top:2px}
.top.mat .eyebrow{letter-spacing:1px;font-size:12px}
.sp{flex:1}
.salir{border:2px solid var(--tinta);background:transparent;padding:5px 12px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.bars{display:flex;gap:5px}
.bars i{display:block;height:6px;flex:1;background:var(--neutro)}
.bars i.on{background:var(--naranja)}
.title{font-family:var(--serif);font-size:clamp(32px,8vw,44px);font-weight:500;line-height:1.08}
.lede{font-family:var(--serif);font-size:20px;font-style:italic;line-height:1.35;color:var(--gris)}
.lede.en{font-size:17px;margin-top:-12px}
.cover{font-family:var(--cond);font-size:clamp(56px,16vw,92px);font-weight:800;line-height:.92;text-transform:uppercase}
.cover span{color:var(--naranja-txt)}
.label{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--naranja-txt)}
.hint{font-size:14px;color:var(--gris)}
.err{color:#B3261E;font-size:15px;min-height:1.2em;font-weight:500}

/* botones */
.btn{width:100%;border:none;background:var(--tinta);color:var(--crema);font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:18px}
.btn.or{background:var(--naranja);color:var(--tinta)}
.btn:disabled{background:var(--neutro);color:var(--gris);cursor:default}
.btn.line{background:transparent;color:var(--tinta);border:2px solid var(--tinta)}
.btn.danger{background:transparent;color:#B3261E;border:2px solid #B3261E}
.btn.danger.arm{background:#B3261E;color:var(--papel)}
.link{border:none;background:none;color:var(--gris);font-size:14px;text-decoration:underline;padding:6px;align-self:center}
.back{align-self:flex-start;border:none;background:none;padding:0;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase}

/* entrar */
.field{display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--tinta);padding-top:16px}
.field input{width:100%;font-family:var(--sans);font-size:28px;font-weight:500;letter-spacing:.06em;padding:12px 0;border:none;border-bottom:2px solid var(--neutro);background:transparent;color:var(--tinta);text-transform:uppercase;border-radius:0}
.field input:focus{outline:none;border-bottom-color:var(--naranja)}
.field input::placeholder{color:var(--neutro)}

/* progreso */
.prog{display:flex;flex-direction:column;gap:10px;background:var(--tinta);color:var(--crema);padding:20px}
.prog .label{color:var(--naranja)}
.prog .big{font-family:var(--serif);font-size:48px;font-weight:500;line-height:1}
.prog .bars i{background:#3A3D43}
.prog .bars i.on{background:var(--naranja)}
.prog p.s{font-size:15px;color:#CFC9BD}

/* compañeros */
.list{display:flex;flex-direction:column}
.mate{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:transparent;border:none;border-top:2px solid var(--tinta);padding:16px 0}
.list .mate:last-child{border-bottom:2px solid var(--tinta)}
.mate .n{font-family:var(--serif);font-size:30px;font-weight:500;color:var(--naranja-txt);line-height:1}
.mate .nm{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.15}
.mate .st{font-size:13px;color:var(--gris);margin-top:3px;font-weight:500;letter-spacing:.5px}
.mate .go{font-size:24px;color:var(--gris)}
.mate .sc{font-family:var(--serif);font-size:28px;font-weight:500}
.mate .sc small{font-size:14px;color:var(--gris)}
.mate.sigue{background:var(--naranja);border-top-color:var(--naranja);padding-left:12px;padding-right:12px}
.mate.sigue .n,.mate.sigue .st,.mate.sigue .go{color:var(--tinta)}
.mate.hecho .n{color:var(--verde)}
.mini{display:flex;gap:3px;align-items:flex-end;height:18px;margin-top:5px}
.mini i{display:block;width:8px;background:var(--neutro);position:relative}
.mini i b{position:absolute;left:0;right:0;bottom:0;background:var(--naranja)}

/* antes de empezar */
.intro{font-family:var(--serif);font-size:21px;line-height:1.4;border-left:4px solid var(--naranja);padding-left:16px}
.pasos{list-style:none;margin:0;padding:0;counter-reset:p;display:flex;flex-direction:column}
.pasos li{counter-increment:p;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:baseline;border-top:2px solid var(--tinta);padding:12px 0;font-weight:500}
.pasos li:last-child{border-bottom:2px solid var(--tinta)}
.pasos li::before{content:counter(p);font-family:var(--serif);font-size:26px;font-weight:500;color:var(--naranja-txt);line-height:1}
.escala{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.escala div{background:var(--papel);border-top:4px solid var(--tinta);padding:10px;display:flex;flex-direction:column;gap:4px}
.escala b{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1}
.escala span{font-size:13px;font-weight:500;line-height:1.25}
@media (max-width:420px){.escala{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* evaluar */
.cats{display:flex;flex-direction:column}
.cat{border-top:2px solid var(--tinta);padding:16px 0 10px;display:flex;flex-direction:column;gap:4px}
.cat:last-child{border-bottom:2px solid var(--tinta)}
.cat.falta{border-top-color:var(--naranja)}
.cat .hd{display:flex;align-items:flex-start;gap:12px}
.cat .t{flex:1;min-width:0}
.cat .t h3{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.15}
.cat .t p{font-size:14px;font-weight:700;color:var(--gris);margin-top:2px;min-height:1em}
.cat .v{font-family:var(--serif);font-size:44px;font-weight:500;line-height:1;color:var(--neutro);font-variant-numeric:tabular-nums}
.cat .v small{font-size:18px;color:var(--gris)}
.cat.ok .v{color:var(--lv,var(--naranja-txt))}
.cat.ok .t p{color:var(--lv,var(--naranja-txt))}
.cat .tag{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--naranja-txt)}
.ticks{display:flex;justify-content:space-between;padding:0 6px;font-size:14px;font-weight:700;color:var(--gris);margin-top:-4px}
.ticks span.on{color:var(--tinta)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:52px;margin:0;background:transparent;touch-action:pan-y;cursor:pointer;--trk:var(--neutro)}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:var(--trk)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;margin-top:-12px;background:var(--tinta);border:4px solid var(--thc,var(--naranja))}
input[type=range]::-moz-range-track{height:10px;background:var(--trk)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:0;background:var(--tinta);border:4px solid var(--thc,var(--naranja))}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--tinta);outline-offset:2px}
.pbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:6px;background:var(--crema);padding-block:8px;z-index:5}

/* tablas */
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 8px;text-align:left;border-top:1px solid var(--neutro);font-variant-numeric:tabular-nums}
thead th{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gris);border-top:2px solid var(--tinta)}
td.r,th.r{text-align:right}

/* profe */
.groups{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.campf{display:flex;gap:6px;flex-wrap:wrap}
.campf button{border:2px solid var(--tinta);background:transparent;color:var(--tinta);padding:6px 12px;min-width:58px;font-family:var(--cond);font-size:20px;font-weight:700;letter-spacing:1px}
.campf button:hover{border-color:var(--naranja)}
.campf button[aria-pressed="true"]{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.gbtn{border:none;border-top:4px solid var(--tinta);background:var(--papel);padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.gbtn:hover{border-top-color:var(--naranja)}
.gbtn .g{font-family:var(--cond);font-size:54px;font-weight:800;line-height:.9;display:flex;align-items:baseline;gap:8px}
.gbtn .g small{font-size:26px;font-weight:600;color:var(--naranja-txt);letter-spacing:1px}
.gbtn .s{font-size:14px;color:var(--gris)}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kp div{border-top:2px solid var(--tinta);padding-top:8px;display:flex;flex-direction:column}
.kp b{font-family:var(--serif);font-size:36px;font-weight:500;line-height:1.05}
.kp span{font-size:13px;color:var(--gris)}
.kp div.or{border-top-color:var(--naranja)}
.team{display:flex;flex-direction:column;gap:6px}
.team h3{font-family:var(--serif);font-size:24px;font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.warn{display:inline-flex;flex:none}
.wlegend{font-family:var(--sans);font-size:12px;font-weight:500;line-height:1.25;color:var(--gris);flex:1 1 140px;min-width:0}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn.sm{width:auto;flex:none;padding:10px 14px;font-size:13px;letter-spacing:1.5px}
.dot{display:inline-block;width:10px;height:10px;background:var(--neutro);margin-right:6px;vertical-align:middle}
.dot.en{background:var(--verde)}
.dot.cu{background:var(--naranja)}
.st2{font-size:13px;color:var(--gris);white-space:nowrap}
.avg{font-family:var(--serif);font-size:20px;font-weight:500}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{font-size:15px;letter-spacing:1.5px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--tinta);color:var(--crema);padding:10px 18px;font-size:14px;font-weight:700;letter-spacing:1px;z-index:50;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.foot{font-size:12px;color:var(--gris);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="sq"></span><span class="eyebrow" id="eyebrow"></span><span class="sp"></span><button class="salir" id="salir" data-i18n="salir" hidden>Salir</button></div>

  <!-- entrar (bilingüe: todavía no sabemos el grupo) -->
  <section id="vLogin" hidden>
    <h1 class="cover">Coevaluación<br><span>de equipo</span></h1>
    <p class="lede">Califica a cada integrante de tu equipo. A ti no te calificas.</p>
    <p class="lede en">Team peer evaluation: rate each member of your team. You don’t rate yourself.</p>
    <form class="field" id="fLogin" autocomplete="off">
      <label class="label" for="mat">Tu matrícula · Student ID</label>
      <input id="mat" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="A01234567" maxlength="12" required>
      <p class="err" id="eLogin"></p>
      <button class="btn or" id="bLogin">Entrar · Enter</button>
    </form>
    <button class="link" id="aProfe">Soy el profe · I’m the teacher</button>
  </section>

  <!-- antes de empezar -->
  <section id="vIntro" hidden>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="label" data-i18n="antes"></span>
      <h1 class="title" id="introHola"></h1>
    </div>
    <p class="intro" data-i18n="introTxt"></p>
    <ol class="pasos" id="pasos"></ol>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="label" data-i18n="escalaT"></span>
      <div class="escala" id="escala"></div>
    </div>
    <button class="btn or" id="bAcuerdo" data-i18n="deAcuerdo"></button>
  </section>

  <!-- compañeros -->
  <section id="vMenu" hidden>
    <h1 class="title" id="hola">Hola</h1>
    <div class="prog">
      <span class="label" id="miEq"></span>
      <p class="big num" id="cuantos">0</p>
      <div class="bars" id="pbars"></div>
      <p class="s" id="menuSub"></p>
    </div>
    <div class="list" id="mates"></div>
    <p class="hint" data-i18n="ajustar"></p>
    <div class="pbar">
      <p class="err" id="eEnviar"></p>
      <button class="btn" id="bEnviar" disabled></button>
    </div>
  </section>

  <!-- evaluar -->
  <section id="vEval" hidden>
    <button class="back" id="bBack" data-i18n="miEquipo"></button>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="label" data-i18n="evaluas"></span>
      <h1 class="title" id="evNm"></h1>
      <p class="lede" data-i18n="mueve"></p>
    </div>
    <div class="cats" id="cats"></div>
    <div class="pbar">
      <p class="err" id="eEval"></p>
      <button class="btn or" id="bGuardar" data-i18n="guardar"></button>
    </div>
  </section>

  <!-- enviado -->
  <section id="vListo" hidden>
    <h1 class="cover" data-i18n="enviado"></h1>
    <p class="lede" id="listoSub"></p>
    <table><thead><tr><th data-i18n="companero"></th><th class="r" data-i18n="tuProm"></th></tr></thead><tbody id="listoT"></tbody></table>
  </section>

  <!-- profe -->
  <section id="vProfe" hidden>
    <button class="back" id="bProfeBack">‹ Volver · Back</button>
    <form class="field" id="fProfe" autocomplete="off">
      <label class="label" for="pass">Contraseña del profe · Teacher password</label>
      <input id="pass" type="password" inputmode="numeric" style="text-transform:none" required>
      <p class="err" id="eProfe"></p>
      <button class="btn">Entrar · Enter</button>
    </form>
    <div id="pGrupos" hidden style="display:flex;flex-direction:column;gap:18px">
      <div class="ghead">
        <h1 class="title">Elige tu grupo<br><span style="color:var(--gris);font-size:.6em;font-style:italic">Choose your group</span></h1>
        <div class="campf" id="campf" role="group" aria-label="Filtrar por campus · Filter by campus"></div>
      </div>
      <div class="groups" id="groups"></div>
    </div>
    <div id="pGrupo" hidden style="display:flex;flex-direction:column;gap:20px">
      <div class="ghead"><h1 class="title" id="gTit"></h1><button class="btn line sm" id="bOtro" data-i18n="otro"></button></div>
      <div class="kp">
        <div class="or"><b class="num" id="kEnv">0</b><span data-i18n="kEnv"></span></div>
        <div><b class="num" id="kCur">0</b><span data-i18n="kCur"></span></div>
        <div><b class="num" id="kNo">0</b><span data-i18n="kNo"></span></div>
      </div>
      <div class="actions"><button class="btn or" id="bCsv" data-i18n="csv"></button><button class="btn or" id="bXlsx" data-i18n="xlsx"></button></div>
      <p class="hint" id="pAct"></p>
      <div id="teams" style="display:flex;flex-direction:column;gap:26px"></div>
      <p class="hint" data-i18n="nota"></p>
      <button class="btn danger" id="bReset"></button>
    </div>
  </section>

  <p class="foot" id="foot" data-i18n="foot">Innovación con enfoque de mercado</p>
</div>
<div class="toast" id="toast" hidden></div>
<div class="ptr" id="ptr" aria-hidden="true"></div>

<script>

  /* color de la barra según la calificación: 1 rojo, 2 y 3 amarillo, 4 verde (barra / texto legible) */
  var COLOR={1:{f:"#D93025",t:"#B3261E"},2:{f:"#F5B800",t:"#8A6100"},3:{f:"#F5B800",t:"#8A6100"},4:{f:"#2F9E57",t:"#2F7D4A"}};

  var T={
    es:{salir:"Salir",eyebrow:"Coevaluación de equipo",panel:"Panel del profe",hola:"Hola, ",grupoEq:"Grupo {g} · {e}",de:"{a} de {b}",
      evaluados:"compañeros evaluados",todos:"¡Ya evaluaste a todos! Revisa y envía.",sigue:"Sigue · tócalo para evaluar",pendiente:"Pendiente",
      enviar:"Enviar mis calificaciones",faltan:"Te faltan {n}",sinComp:"No hay compañeros en tu equipo",ajustar:"Hasta que envíes, puedes volver a cualquier compañero y ajustar sus calificaciones.",
      miEquipo:"‹ Mi equipo",evaluas:"Evalúas a",mueve:"Mueve cada barra del 1 al 4.",guardar:"Guardar y volver",sinMover:"Sin mover",
      falta1:"Te falta 1 categoría por mover",faltaN:"Te faltan {n} categorías por mover",otraVez:". Si de verdad van en 1, toca Guardar otra vez.",guardado:"Guardado: ",
      seguro:"¿Seguro? Ya no podrás cambiarlas. Toca otra vez",enviando:"Enviando…",reintento:"Mucha gente enviando… reintento {n}",noEnvio:"No se pudo enviar ({e}). Revisa tu internet e intenta otra vez.",
      enviado:"¡Enviado!",gracias:"Gracias, {n}. Tus calificaciones de {k} compañeros ya llegaron.",companero:"Compañero",tuProm:"Tu promedio",

    ver("vProfe");
    $("groups").innerHTML=lista.map(function(g){
      var en=langDe(g)==="en";
      var al=datos.alumnos.filter(function(a){ return a.grupo===g; });
      var env=al.filter(function(a){ return a.estado==="enviado"; }).length;
      var eq=[]; al.forEach(function(a){ if(eq.indexOf(a.equipo)<0) eq.push(a.equipo); });
      var s=en?(al.length+" students · "+eq.length+" teams<br>"+env+" submitted"):(al.length+" alumnos · "+eq.length+" equipos<br>"+env+" ya enviaron");
      var pz=String(g).split(" "), camp=pz.length>1?pz[0]:"", num=pz[pz.length-1];
      return '<button class="gbtn" data-g="'+esc(g)+'"><span class="label">'+(en?"Group":"Grupo")+(en?" · English":"")+'</span><span class="g">'+(camp?'<small>'+esc(camp)+'</small>':'')+esc(num)+'</span><span class="s">'+s+'</span></button>';
    }).join("");
  }
  $("campf").addEventListener("click",function(ev){
    var b=ev.target.closest("button[data-c]"); if(!b) return;
    var c=b.getAttribute("data-c"), i=campSel.indexOf(c);
    campSel=i>=0?[]:[c];
    pintaGrupos();
  });
  $("groups").addEventListener("click",function(ev){ var b=ev.target.closest("button[data-g]"); if(b) abreGrupo(b.getAttribute("data-g")); });
  $("bOtro").addEventListener("click",function(){ clearInterval(tRef); grupo=null; pintaGrupos(); });
  function pintaGrupo(){
    idioma(langDe(grupo));
    $("pGrupos").hidden=true; $("pGrupo").hidden=false; $("bProfeBack").textContent=t("grupos");
    marca("#profe-"+encodeURIComponent(grupo));
    var y=window.scrollY; ver("vProfe"); if(refrescando) window.scrollTo(0,y);
    var al=datos.alumnos.filter(function(a){ return a.grupo===grupo; });
    $("gTit").textContent=t("grupo")+" "+grupo;
    $("kEnv").textContent=al.filter(function(a){ return a.estado==="enviado"; }).length;
    $("kCur").textContent=al.filter(function(a){ return a.estado==="en curso"; }).length;
    $("kNo").textContent=al.filter(function(a){ return a.estado==="sin empezar"; }).length;
    $("pAct").textContent=t("act")+new Date().toLocaleTimeString(LANG==="en"?"en-US":"es-MX",{hour:"numeric",minute:"2-digit"});
    if(!armR) $("bReset").textContent=t("reset");
    var eqs=[]; al.forEach(function(a){ if(eqs.indexOf(a.equipo)<0) eqs.push(a.equipo); });
    eqs.sort(function(a,b){ return (parseInt(a.replace(/\D/g,""))||0)-(parseInt(b.replace(/\D/g,""))||0); });
    $("teams").innerHTML=eqs.map(function(eq){
      var m=al.filter(function(a){ return a.equipo===eq; });
      var completo=m.every(function(a){ return a.estado==="enviado"; });
      return '<div class="team"><h3><span class="sq"></span>'+esc(eqNom(eq))+(completo?"":WARN.replace(/\{a\}/g,esc(t("warn")))+'<span class="wlegend">'+esc(t("wleg"))+'</span>')+'</h3><table><thead><tr><th>'+t("integrante")+'</th><th>'+t("estatus")+'</th><th class="r">'+t("promedio")+'</th></tr></thead><tbody>'+
        m.map(function(a){
          var c=a.estado==="enviado"?"en":(a.estado==="en curso"?"cu":"");
          var s=a.estado==="enviado"?t("envio"):(a.estado==="en curso"?t("califico",{a:a.hechas,b:a.porEvaluar}):t("sinEmpezar"));
          return '<tr><td>'+esc(a.nombre)+'</td><td><span class="st2"><span class="dot '+c+'"></span>'+s+'</span></td><td class="r"><span class="avg num">'+(a.promedio==null?"–":f2(a.promedio))+'</span></td></tr>';
        }).join("")+'</tbody></table></div>';
    }).join("");
  }

  function celda(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  /* Las mismas filas para CSV y XLSX; los números van como números. porcentaje = promedio / 4 (en CSV como «85%», en XLSX con formato de %).
     factor_final_ecualizado = promedio de las calificaciones recibidas con 4=100, 3=85, 2=70, 1=50 (lo calcula el servidor) */
  function filasExport(){
    var al=datos.alumnos.filter(function(a){ return a.grupo===grupo; });
    var st={"enviado":t("stEnv"),"en curso":t("stCur"),"sin empezar":t("stNo")};
    return [t("csvHead").concat(cats(),[t("csvProm"),t("csvB100"),t("csvEcual")])].concat(al.map(function(a){
      return [a.grupo,eqNom(a.equipo),a.nombre,a.matricula,st[a.estado]||a.estado,a.recibidas].concat(cats().map(function(_,i){ return a.porCat?a.porCat[i]:""; }),[a.promedio==null?"":a.promedio,a.promedio==null?"":Math.round(a.promedio/4*10000)/10000,a.ecual==null?"":a.ecual]);
    }));
  }
  function nombreArchivo(ext){ return (LANG==="en"?"team-peer-evaluation-group-":"coevaluacion-equipo-grupo-")+String(grupo).replace(/\s+/g,"-")+"-"+new Date().toISOString().slice(0,10)+"."+ext; }
  function bajar(blob,nombre){
    var url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=nombre;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); },2000);
  }
  $("bCsv").addEventListener("click",function(){
    var b=$("bCsv"); b.disabled=true; b.textContent=t("preparando");
    carga().then(function(){
      var csv="﻿"+filasExport().map(function(r,k){ return r.map(function(v,i){ return (k>0&&i===r.length-2&&v!=="")?celda(Math.round(v*1000)/10+"%"):celda(v); }).join(","); }).join("\r\n");
      bajar(new Blob([csv],{type:"text/csv;charset=utf-8"}),nombreArchivo("csv"));
      toast(t("descargado"));
    }).catch(function(e){ toast(t("noSePudo")+errTxt(e.message)); })
      .then(function(){ b.disabled=false; b.textContent=t("csv"); });
  });
  /* XLSX: la librería SheetJS se carga solo cuando se pide */
  var xlsxLib=null;
  function cargaXlsx(){
    if(window.XLSX) return Promise.resolve(window.XLSX);
    if(xlsxLib) return xlsxLib;
    xlsxLib=new Promise(function(res,rej){
      var s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload=function(){ res(window.XLSX); }; s.onerror=function(){ xlsxLib=null; rej(new Error("XLSX")); };
      document.head.appendChild(s);
    });
    return xlsxLib;
  }
  $("bXlsx").addEventListener("click",function(){
    var b=$("bXlsx"); b.disabled=true; b.textContent=t("preparando");
    Promise.all([carga(),cargaXlsx()]).then(function(r){
      var X=r[1], rows=filasExport();
      var ws=X.utils.aoa_to_sheet(rows), pc=rows[0].length-2;
      for(var k=1;k<rows.length;k++){ var ref=X.utils.encode_cell({r:k,c:pc}); if(ws[ref]&&typeof ws[ref].v==="number") ws[ref].z="0.0%";
        var ref2=X.utils.encode_cell({r:k,c:pc+1}); if(ws[ref2]&&typeof ws[ref2].v==="number") ws[ref2].z="0.0"; }
      ws["!cols"]=rows[0].map(function(h,i){ var w=String(h).length; rows.forEach(function(f){ w=Math.max(w,String(f[i]==null?"":f[i]).length); }); return {wch:Math.min(w+2,42)}; });
      var wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,t("hoja",{g:grupo}));
      var out=X.write(wb,{bookType:"xlsx",type:"array"});
      bajar(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),nombreArchivo("xlsx"));
      toast(LANG==="en"?"XLSX downloaded":"XLSX descargado");
    }).catch(function(e){ toast(t("noSePudo")+errTxt(e.message)); })
      .then(function(){ b.disabled=false; b.textContent=t("xlsx"); });
  });

  var armR=false, tR=null;
  $("bReset").addEventListener("click",function(){
    var b=$("bReset");
    if(!armR){ armR=true; b.classList.add("arm"); b.textContent=t("resetSeguro",{g:grupo});
      clearTimeout(tR); tR=setTimeout(function(){ armR=false; b.classList.remove("arm"); b.textContent=t("reset"); },5000); return; }
    armR=false; clearTimeout(tR); b.disabled=true; b.textContent=t("borrando");
    api("reset",{pass:pass,grupo:grupo}).then(function(o){ datos=o; pintaGrupo(); toast(t("enCero",{g:grupo})); })
      .catch(function(e){ toast(t("noSePudo")+errTxt(e.message)); })
      .then(function(){ b.disabled=false; b.classList.remove("arm"); b.textContent=t("reset"); });
  });

  /* ---------- arranque ---------- */
  function arranca(){
    var m=null; try{ m=localStorage.getItem("coeq:yo"); }catch(e){}
    var loc=m?leeLocal(m):null;
    if(loc&&loc.m&&loc.companeros){
      S=loc; if(!S.pend) S.pend=[];
      idioma(langDe(S.grupo));
      if(S.enviado) pintaListo(); else if(S.acepto) pintaMenu(); else pintaIntro();
      api("login",{matricula:S.m}).then(function(o){ if(S&&S.m===o.matricula&&(!actual||S.ronda!==o.ronda)) aplicaServidor(o); }).catch(function(){});
    }else { idioma("es"); ver("vLogin"); }
  }
  /* ---------- jalar hacia abajo: actualiza solo la pantalla actual ---------- */
  var refrescando=false, y0=null, dy=0, UMBRAL=70, ptr=$("ptr");
  function vista(){ for(var i=0;i<VISTAS.length;i++) if(!$(VISTAS[i]).hidden) return VISTAS[i]; return ""; }
  function ptrPos(p){ ptr.style.transform="translate(-50%,"+(-80+p)+"px)"; }
  function refresca(){
    if(refrescando) return;
    refrescando=true; ptr.classList.remove("listo"); ptr.textContent=t("actualizando"); ptrPos(80);
    var v=vista(), p;
    if(v==="vProfe"&&pass) p=carga().then(function(){ if(grupo&&!$("pGrupo").hidden) pintaGrupo(); else if(!$("pGrupos").hidden) pintaGrupos(); });
    else if(S&&(v==="vMenu"||v==="vListo")) p=api("login",{matricula:S.m}).then(function(o){ if(S&&S.m===o.matricula) aplicaServidor(o); });
    else p=Promise.resolve(); /* en Evaluar o en Entrar no se toca nada, para no perder lo que llevan */
    p.then(function(){ toast(t("actualizado")); }).catch(function(e){ toast(t("noSePudo")+errTxt(e.message)); })
      .then(function(){ refrescando=false; ptrPos(0); });
  }
  document.addEventListener("touchstart",function(e){
    y0=(!refrescando&&window.scrollY<=0&&e.touches.length===1&&!(e.target.closest&&e.target.closest('input[type="range"]')))?e.touches[0].clientY:null; dy=0;
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(y0==null) return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0||window.scrollY>0){ ptr.classList.remove("drag"); ptrPos(0); return; }
    var p=Math.min(dy*0.6,90); ptr.classList.add("drag"); ptrPos(p);
    var ya=dy>UMBRAL; ptr.classList.toggle("listo",ya); ptr.textContent=ya?t("suelta"):t("jala");
  },{passive:true});
  document.addEventListener("touchend",function(){
    if(y0==null) return;
    ptr.classList.remove("drag");
    if(dy>UMBRAL) refresca(); else ptrPos(0);
    y0=null; dy=0;
  });

  idioma("es");
  if(/^#profe/.test(location.hash)){ retomaPanel(); } else arranca();
})();
</script>
</body>
</html>
